name: Release

# Runs when a GitHub Release is published (tag vX.Y.Z). Builds both apps and
# attaches the APK, the Windows installer and SHA256SUMS.txt to the release.
#
# Optional secrets for a release-signed APK (without them the debug-signed APK
# is published as OpenScreen-<version>-debug.apk):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional (Windows code signing, Phase 11):
#   WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    name: Check tag matches app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./desktop/package.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::Release tag v$tag does not match app version $app"; exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix scripts && npm test --prefix scripts

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    outputs:
      signing: ${{ steps.mode.outputs.signing }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.1 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      # Release signing is optional. With all four secrets the APK is release-signed;
      # without them the debug build (Android's auto-generated debug key) is published,
      # clearly named, so releases never block on keystore setup.
      - name: Choose signing mode
        id: mode
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PW" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PW" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release signing secrets not set; publishing the debug-signed APK."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build (release-signed)
        if: steps.mode.outputs.signing == 'release'
        env:
          OPENSCREEN_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          OPENSCREEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENSCREEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENSCREEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain lint test assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/OpenScreen-${{ needs.version.outputs.version }}.apk"
      - name: Test and build (debug-signed)
        if: steps.mode.outputs.signing == 'debug'
        run: |
          ./gradlew --console=plain lint test assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/OpenScreen-${{ needs.version.outputs.version }}-debug.apk"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ runner.temp }}/OpenScreen-*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: version
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm test
      - working-directory: desktop/src-tauri
        run: cargo test --locked
      - run: npm run tauri build -- --ci
      # Windows code signing is wired up in Phase 11 (WINDOWS_CERTIFICATE_* secrets).
      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "$env:RUNNER_TEMP/OpenScreen-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ runner.temp }}/OpenScreen-*-setup.exe
          if-no-files-found: error

  publish:
    name: Attach assets to release
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum OpenScreen-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Explain debug signing in the release notes
        if: needs.android.outputs.signing == 'debug'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          if ! grep -q "The Android APK is debug-signed" notes.md; then
            {
              echo
              echo "> **The Android APK is debug-signed** (Android's auto-generated development key)."
              echo "> It installs normally for testing. Android cannot update between differently"
              echo "> signed builds: if it reports a conflict, uninstall OpenScreen first, then install this APK."
            } >> notes.md
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
      - name: Generate release notes if empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if [ -z "$body" ]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -q .body)
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi
