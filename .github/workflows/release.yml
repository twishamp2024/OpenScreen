name: Release

# Runs when a GitHub Release is published (tag vX.Y.Z). Builds both apps,
# signs them with secrets when configured, and attaches the APK, the Windows
# installer and SHA256SUMS.txt to the release.
#
# Required secrets for a signed APK:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional (Windows code signing, Phase 11):
#   WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    name: Check tag matches app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./desktop/package.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::Release tag v$tag does not match app version $app"; exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix scripts && npm test --prefix scripts

  android:
    name: Signed APK
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.1 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned APK."; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Test and build
        env:
          OPENSCREEN_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          OPENSCREEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENSCREEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENSCREEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --console=plain lint test assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/OpenScreen-${{ needs.version.outputs.version }}.apk"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ runner.temp }}/OpenScreen-*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: version
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm test
      - working-directory: desktop/src-tauri
        run: cargo test --locked
      - run: npm run tauri build -- --ci
      # Windows code signing is wired up in Phase 11 (WINDOWS_CERTIFICATE_* secrets).
      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "$env:RUNNER_TEMP/OpenScreen-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ runner.temp }}/OpenScreen-*-setup.exe
          if-no-files-found: error

  publish:
    name: Attach assets to release
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum OpenScreen-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Generate release notes if empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if [ -z "$body" ]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -q .body)
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi
