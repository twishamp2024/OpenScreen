name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol & repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci --prefix scripts
      - run: npm test --prefix scripts

  android:
    name: Android build, lint & unit tests
    runs-on: ubuntu-latest
    needs: protocol
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.1 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --console=plain lint test assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: openscreen-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Windows build, lint & tests
    runs-on: windows-latest
    needs: protocol
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: cargo fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build installer
        run: npm run tauri build -- --ci
      - uses: actions/upload-artifact@v7
        with:
          name: openscreen-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
