[package]
name = "openscreen-receiver"
version = "0.1.0"
description = "OpenScreen receiver for Windows"
authors = ["OpenScreen contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "openscreen_receiver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
thiserror = "2"
log = "0.4"
# Signaling server (docs/ARCHITECTURE.md §2.2). TLS 1.3 only, `ring` crypto
# provider (aws-lc-rs would need CMake/NASM on Windows build machines).
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
getrandom = "0.4"
subtle = "2.6"
sha2 = "0.11"
base64 = "0.23"
if-addrs = "0.15"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }

[[example]]
# Headless fake phone for testing a running receiver (docs/TESTING.md).
name = "probe"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
